  .voile{
    background:linear-gradient(180deg,
      rgba(10,30,58,.46) 0%,
      rgba(10,30,58,.06) 20%,
      rgba(10,30,58,0) 40%,
      rgba(10,30,58,.10) 55%,
      rgba(10,30,58,.42) 72%,
      rgba(10,30,58,.70) 88%,
      rgba(10,30,58,.80) 100%);
  }
  .nuit{background:#061428;opacity:.26;transition:opacity 1.2s linear}

  /* ---- structure ---- */
  .page{
    position:relative;z-index:1;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:clamp(14px,3.5vw,30px) clamp(16px,4vw,32px) 0;
    text-shadow:0 2px 18px rgba(6,20,40,.55);
  }
  .souffle{flex:1;min-height:1vh}

  /* ---- arc solaire ---- */
  .ciel{width:100%;max-width:400px;opacity:.9}
  .ciel svg{width:100%;height:auto;display:block;overflow:visible}
  .arc{fill:none;stroke:rgba(255,248,231,.30);stroke-width:1;stroke-dasharray:2 7;stroke-linecap:round}
  .sol-halo{fill:var(--or);opacity:.22}
  .sol{fill:var(--or)}
  .zenith-mark{fill:none;stroke:rgba(255,248,231,.5);stroke-width:1}
  .zenith-txt{font-family:"Space Grotesk",sans-serif;font-size:9px;letter-spacing:.18em;fill:rgba(255,248,231,.7);text-transform:uppercase}
  @media (prefers-reduced-motion:no-preference){
    .sol{animation:respire 4.5s ease-in-out infinite}
    @keyframes respire{0%,100%{opacity:1}50%{opacity:.85}}
  }

  /* ---- bloc central ---- */
  main{width:100%;max-width:500px;text-align:center;display:flex;flex-direction:column;gap:clamp(12px,3vw,18px)}
  .titre{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vw,12px)}
  .nom{
    position:relative;
    font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:clamp(38px,12.6vw,78px);line-height:1;
    text-transform:uppercase;letter-spacing:.15em;text-indent:.15em;
    color:#FFF3D2;
    text-shadow:0 2px 16px rgba(6,20,40,.75),0 0 42px rgba(245,196,81,.35);
  }
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .nom{
      background:linear-gradient(176deg,#FFFDF6 0%,#FFF1C8 32%,#F5C451 64%,#E2934A 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:none;
    }
    .nom::before{
      content:"YASMINE";position:absolute;inset:0;z-index:-1;
      color:rgba(6,20,40,.55);-webkit-text-fill-color:rgba(6,20,40,.55);
      filter:blur(14px);
    }
  }
  .nom .l{display:inline-block}
  .age{
    font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:clamp(21px,6.6vw,38px);line-height:1;color:var(--or);
    display:flex;align-items:center;gap:clamp(9px,2.6vw,16px);
  }
  .age::before,.age::after{
    content:"";height:1px;width:clamp(22px,7vw,46px);
    background:linear-gradient(90deg,transparent,rgba(245,196,81,.85));
  }
  .age::after{background:linear-gradient(90deg,rgba(245,196,81,.85),transparent)}

  @media (prefers-reduced-motion:no-preference){
    .nom .l{opacity:0;transform:translateY(.22em);animation:leve .85s cubic-bezier(.2,.75,.25,1) forwards}
    .nom .l:nth-child(1){animation-delay:.05s}
    .nom .l:nth-child(2){animation-delay:.13s}
    .nom .l:nth-child(3){animation-delay:.21s}
    .nom .l:nth-child(4){animation-delay:.29s}
    .nom .l:nth-child(5){animation-delay:.37s}
    .nom .l:nth-child(6){animation-delay:.45s}
    .nom .l:nth-child(7){animation-delay:.53s}
    .age{opacity:0;animation:leve .9s .68s cubic-bezier(.2,.75,.25,1) forwards}
    @keyframes leve{to{opacity:1;transform:none}}
  }

  .compteur{
    display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,2vw,14px);
    background:rgba(8,24,48,.42);border:1px solid rgba(255,248,231,.18);
    border-radius:20px;padding:clamp(13px,3.4vw,20px) clamp(6px,2vw,14px);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  .unite{display:flex;flex-direction:column;gap:6px;position:relative}
  .unite + .unite::before{content:"";position:absolute;left:calc(-1 * clamp(2px,1vw,7px));top:14%;bottom:26%;width:1px;background:rgba(255,248,231,.16)}
  .val{font-size:clamp(29px,10vw,54px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .lab{font-size:clamp(9px,2.3vw,11px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,248,231,.7)}

  .stats{width:100%;max-width:500px;display:flex;justify-content:center;gap:clamp(14px,5vw,34px)}
  .stat{flex:1;text-align:center;display:flex;flex-direction:column;gap:5px;position:relative}
  .stat + .stat::before{content:"";position:absolute;left:calc(-1 * clamp(7px,2.5vw,17px));top:6%;bottom:12%;width:1px;background:rgba(255,248,231,.18)}
  .vie-lab{font-size:clamp(9px,2.3vw,11px);letter-spacing:.24em;text-transform:uppercase;color:rgba(255,248,231,.66)}
  .vie-val{font-size:clamp(16px,4.9vw,28px);font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--or);white-space:nowrap}

  /* ---- prairie ---- */
  .prairie{width:100%;max-width:560px;margin-top:clamp(2px,1vw,8px)}
  .prairie svg{width:100%;height:auto;display:block}
  .tige{fill:none;stroke:#7FB98B;stroke-width:2.2;stroke-linecap:round}
  .feuille{fill:#7FB98B;opacity:.9}
  .coeur{fill:#F7E7A6}
  @media (prefers-reduced-motion:no-preference){
    .fleur{transform-box:fill-box;transform-origin:bottom center;animation:brise 6s ease-in-out infinite}
    .fleur:nth-child(2n){animation-duration:7.4s;animation-delay:-1.8s}
    .fleur:nth-child(3n){animation-duration:8.2s;animation-delay:-3.1s}
    @keyframes brise{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
  }

  /* ---- arrivee ---- */
  .fete{display:none;font-family:"Instrument Serif",Georgia,serif;font-size:clamp(19px,5.2vw,28px);line-height:1.3;color:var(--lait)}
  body.arrivee .fete{display:block}
  body.arrivee .compteur{display:none}
  body.arrivee .nuit{opacity:0}
</style>
</head>
<body>

  <div class="fond"></div>
  <div class="voile"></div>
  <div class="nuit" id="nuit"></div>

  <div class="page">

    <section class="ciel" aria-hidden="true">
      <svg viewBox="0 0 400 118">
        <path class="arc" d="M20 110 A180 100 0 0 1 380 110"/>
        <line class="zenith-mark" x1="200" y1="2" x2="200" y2="24"/>
        <text class="zenith-txt" x="200" y="40" text-anchor="middle">midi pile</text>
        <circle class="sol-halo" id="halo" cx="20" cy="110" r="30"/>
        <circle class="sol" id="sol" cx="20" cy="110" r="12"/>
      </svg>
    </section>

    <div class="souffle"></div>

    <main>
      <div class="titre">
        <h1 class="nom" aria-label="Yasmine"><span class="l">Y</span><span class="l">A</span><span class="l">S</span><span class="l">M</span><span class="l">I</span><span class="l">N</span><span class="l">E</span></h1>
        <p class="age">23 ans</p>

      <div class="compteur" id="compteur" role="timer">
        <div class="unite"><span class="val" id="j">--</span><span class="lab">jours</span></div>
        <div class="unite"><span class="val" id="h">--</span><span class="lab">heures</span></div>
        <div class="unite"><span class="val" id="m">--</span><span class="lab">min</span></div>

<script>
  var NAISSANCE = new Date("2003-08-04T12:00:00+02:00").getTime();
  var CIBLE     = new Date("2026-08-04T12:00:00+02:00").getTime();
  var FENETRE   = 24 * 3600 * 1000;

  var elJ=document.getElementById("j"),elH=document.getElementById("h"),
      elM=document.getElementById("m"),elS=document.getElementById("s"),
      elVie=document.getElementById("vie"),elJours=document.getElementById("jours"),
      nuit=document.getElementById("nuit"),
      sol=document.getElementById("sol"),halo=document.getElementById("halo"),
      petales=document.querySelectorAll(".petales g");

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function espaces(n){ return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u202F"); }

  function eclore(p){
    for (var i = 0; i < petales.length; i++){
      var d = parseFloat(petales[i].parentNode.getAttribute("data-d")) || 0;
      var t = Math.min(Math.max((p - d) / (1 - d), 0), 1);
      var k = 0.14 + 0.86 * (1 - Math.pow(1 - t, 2));
      petales[i].setAttribute("transform", "scale(" + k.toFixed(3) + ")");
    }
  }

  function tic(){
    var maintenant = Date.now();
    var reste = CIBLE - maintenant;

    elVie.textContent = espaces((maintenant - NAISSANCE) / 1000);
    elJours.textContent = espaces((maintenant - NAISSANCE) / 86400000);

    if (reste <= 0){
      document.body.classList.add("arrivee");
      sol.setAttribute("cx",200); sol.setAttribute("cy",10);
      halo.setAttribute("cx",200); halo.setAttribute("cy",10); halo.setAttribute("r",42);
      nuit.style.opacity = 0;
      eclore(1);
      return;
    }

    var total = Math.floor(reste / 1000);
    elJ.textContent = pad(Math.floor(total / 86400));
    elH.textContent = pad(Math.floor(total % 86400 / 3600));
    elM.textContent = pad(Math.floor(total % 3600 / 60));
    elS.textContent = pad(total % 60);

    var p = 1 - Math.min(Math.max(reste / FENETRE, 0), 1);
    var theta = Math.PI - p * (Math.PI / 2);
    sol.setAttribute("cx", 200 + 180 * Math.cos(theta));
    sol.setAttribute("cy", 110 - 100 * Math.sin(theta));
    halo.setAttribute("cx", 200 + 180 * Math.cos(theta));
    halo.setAttribute("cy", 110 - 100 * Math.sin(theta));
    halo.setAttribute("r", 26 + 16 * p);

    nuit.style.opacity = (0.26 * (1 - p)).toFixed(3);

    eclore(p);
  }

  tic();
  setInterval(tic, 200);
</script>
