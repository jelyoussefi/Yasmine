  .page{
    position:relative;z-index:1;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:clamp(10px,2.6vw,22px) clamp(16px,4vw,32px) 0;
    overflow:hidden;
  }
  .souffle{flex:1;min-height:6vh}

  /* ---- arc solaire ---- */
  .ciel{width:100%;max-width:360px}
  .ciel svg{width:100%;height:auto;display:block;overflow:visible}

  .arc-ombre{fill:none;stroke:rgba(24,15,10,.42);stroke-width:4;stroke-linecap:round}
  .arc-voie{fill:none;stroke:rgba(255,248,231,.34);stroke-width:1;stroke-linecap:round}

  .tick{stroke:rgba(255,248,231,.42);stroke-width:1.1;stroke-linecap:round;transition:stroke .8s linear,opacity .8s linear}
  .tick.passe{stroke:var(--or);opacity:.95}

  .arc-fait{fill:none;stroke:url(#degOr);stroke-width:2.6;stroke-linecap:round;
            stroke-dasharray:1000;filter:url(#lueur)}
  .arc-eclat{fill:none;stroke:rgba(255,251,238,.95);stroke-width:2;stroke-linecap:round;
             stroke-dasharray:34 966;filter:url(#lueur)}

  .zenith-ombre{fill:none;stroke:rgba(24,15,10,.5);stroke-width:3.4;stroke-linecap:round}
  .zenith-mark{fill:none;stroke:rgba(255,248,231,.95);stroke-width:1.5}
  .zenith-txt{
    font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700;letter-spacing:.04em;
    fill:#FFF8E7;paint-order:stroke fill;
    stroke:rgba(20,12,7,.75);stroke-width:4.5;stroke-linejoin:round;
  }
  body.arrivee .zenith-txt{fill:var(--or)}

  .couronne{fill:url(#couronne)}
  .sol-anneau{fill:none;stroke:#FFC96B;stroke-width:1.1}
  .rayon{stroke:#FFCB63;stroke-width:1.7;stroke-linecap:round;opacity:.85}
  .rayon.court{stroke:#FFDF95;stroke-width:1.3;opacity:.6}
  .sol{fill:url(#disqueSol);stroke:rgba(233,139,44,.55);stroke-width:.8;filter:url(#lueur)}

  @media (prefers-reduced-motion:no-preference){
    .sol{animation:respireSol 4.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes respireSol{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    .rayons{animation:pulseRayons 4.6s ease-in-out infinite}
    @keyframes pulseRayons{0%,100%{opacity:1}50%{opacity:.55}}
  }

  /* ---- titre, en haut ---- */
  .titre{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.4vw,10px);margin-top:clamp(4px,1.5vw,12px)}
  .titre::before{
    content:"";position:absolute;z-index:-1;
    left:-14%;right:-14%;top:-55%;bottom:-45%;
    background:radial-gradient(ellipse at center,
      rgba(26,17,11,.72) 0%,rgba(26,17,11,.58) 34%,rgba(26,17,11,.28) 58%,rgba(26,17,11,0) 76%);
  }
  .nom{
    font-family:"Instrument Serif",Georgia,serif;font-weight:400;
    font-size:clamp(34px,10.6vw,64px);line-height:1;
    text-transform:uppercase;letter-spacing:.17em;text-indent:.17em;
    color:#FFF7E4;
    text-shadow:0 2px 4px rgba(26,17,11,.9),0 6px 30px rgba(26,17,11,.75),0 0 52px rgba(245,196,81,.4);
  }
  .nom .l{display:inline-block}
  .age{
    font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:clamp(19px,5.6vw,32px);line-height:1;color:var(--or);
    display:flex;align-items:center;gap:clamp(9px,2.6vw,16px);
    text-shadow:0 2px 12px rgba(28,18,12,.7);
  }
  .age::before,.age::after{content:"";height:1px;width:clamp(20px,6vw,42px);background:linear-gradient(90deg,transparent,rgba(245,196,81,.85))}
  .age::after{background:linear-gradient(90deg,rgba(245,196,81,.85),transparent)}

  /* ---- compteur, en bas ---- */
  main{width:100%;max-width:480px;text-align:center;display:flex;flex-direction:column;gap:clamp(8px,1.9vw,12px);text-shadow:0 2px 14px rgba(28,18,12,.6)}
  .compteur{
    display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,2vw,14px);
    background:rgba(30,20,13,.28);border:1px solid rgba(255,248,231,.12);
    border-radius:16px;padding:clamp(7px,1.9vw,12px) clamp(6px,2vw,14px);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .unite{display:flex;flex-direction:column;gap:3px;position:relative}
  .unite + .unite::before{content:"";position:absolute;left:calc(-1 * clamp(2px,1vw,7px));top:14%;bottom:26%;width:1px;background:rgba(255,248,231,.22)}
  .val{font-size:clamp(24px,7.6vw,42px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .lab{font-size:clamp(8px,1.9vw,10px);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,248,231,.72)}

  .stats{position:relative;width:100%;max-width:480px;display:flex;justify-content:center;gap:clamp(14px,5vw,30px)}
  .stats::before{
    content:"";position:absolute;z-index:-1;
    left:-8%;right:-8%;top:-70%;bottom:-70%;
    background:radial-gradient(ellipse at center,
      rgba(26,17,11,.62) 0%,rgba(26,17,11,.44) 42%,rgba(26,17,11,0) 74%);
  }
  .stat{flex:1;text-align:center;display:flex;flex-direction:column;gap:4px;position:relative}
  .stat + .stat::before{content:"";position:absolute;left:calc(-1 * clamp(7px,2.5vw,15px));top:6%;bottom:12%;width:1px;background:rgba(255,248,231,.18)}
  .vie-lab{font-size:clamp(8px,2.1vw,10px);letter-spacing:.24em;text-transform:uppercase;color:rgba(255,248,231,.7)}
  .vie-val{font-size:clamp(15px,4.4vw,25px);font-weight:500;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--or);white-space:nowrap}

  /* ---- rose ---- */
  .rose{width:100%;display:flex;justify-content:center;align-items:flex-end;margin-top:clamp(6px,2vw,14px);line-height:0;pointer-events:none}
  .souffle-rose{transform-origin:bottom center}
  .rose img{
    height:clamp(104px,21vh,215px);width:auto;display:block;
    transform-origin:bottom center;
    filter:drop-shadow(0 14px 34px rgba(0,0,0,.55));
  }
  @media (prefers-reduced-motion:no-preference){
    .souffle-rose{animation:brise 7s ease-in-out infinite}
    @keyframes brise{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
  }

  /* ---- arrivee ---- */
  .fete{
    display:none;position:relative;
    flex-direction:column;align-items:center;gap:clamp(3px,1vw,7px);
  }
  .fete::before{
    content:"";position:absolute;z-index:-1;left:-10%;right:-10%;top:-40%;bottom:-40%;
    background:radial-gradient(ellipse at center,rgba(245,196,81,.20) 0%,rgba(26,17,11,.42) 34%,rgba(26,17,11,0) 74%);
  }
  .voeu{
    margin:0;opacity:0;transform:translateY(12px);
    transition:opacity 1s ease,transform 1s cubic-bezier(.2,.75,.25,1);
    font-family:"Instrument Serif",Georgia,serif;font-weight:400;line-height:1.2;
    font-size:clamp(21px,5.6vw,34px);
    color:#FFF7E4;
    text-shadow:0 2px 4px rgba(26,17,11,.92),0 6px 26px rgba(26,17,11,.72),0 0 44px rgba(245,196,81,.42);
  }
  .voeu.actif{opacity:1;transform:none}
  .voeu.en{font-size:clamp(16px,4.2vw,26px);color:rgba(255,247,228,.92)}
  .voeu.ar{font-family:"Noto Naskh Arabic",serif;font-size:clamp(17px,4.6vw,27px);line-height:1.6;color:var(--or)}
  .voeu.jp{font-family:"Noto Serif JP",serif;font-size:clamp(14px,3.7vw,21px);color:rgba(255,247,228,.9)}
  .fete .filet{width:clamp(46px,14vw,90px);height:1px;margin:clamp(2px,.8vw,6px) 0;opacity:0;
               background:linear-gradient(90deg,transparent,rgba(245,196,81,.9),transparent);
               transition:opacity 1s ease}
  .fete .filet.actif{opacity:1}
  body.arrivee .fete{display:flex}
  body.arrivee .stats{margin-top:clamp(2px,1vw,8px)}
  body.arrivee .compteur{display:none}
  body.arrivee .age{
    opacity:1;
    animation:eclat 1.7s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes eclat{
    0%,100%{
      color:var(--or);transform:scale(1);
      text-shadow:0 2px 12px rgba(26,17,11,.75),0 0 12px rgba(245,196,81,.35);
    }
    50%{
      color:#FFF6DC;transform:scale(1.07);
      text-shadow:0 2px 12px rgba(26,17,11,.75),0 0 26px rgba(255,231,166,.95),0 0 58px rgba(245,196,81,.6);
    }
  }
  body.arrivee .rose img{height:clamp(64px,10vh,124px)}

  /* ecrans larges mais peu hauts : on compacte les voeux */
  @media (min-width:900px) and (max-height:840px){
    body.arrivee .rose img{height:clamp(48px,7vh,84px)}
    .voeu{font-size:clamp(18px,3.3vh,27px)}
    .voeu.en{font-size:clamp(14px,2.5vh,20px)}
    .voeu.ar{font-size:clamp(15px,2.7vh,21px)}
    .voeu.jp{font-size:clamp(12px,2.2vh,17px)}
  }

  @media (prefers-reduced-motion:no-preference){
    .nom .l{opacity:0;transform:translateY(.22em);animation:leve .85s cubic-bezier(.2,.75,.25,1) forwards}
    .nom .l:nth-child(1){animation-delay:.05s}
    .nom .l:nth-child(2){animation-delay:.13s}
    .nom .l:nth-child(3){animation-delay:.21s}
    .nom .l:nth-child(4){animation-delay:.29s}
    .nom .l:nth-child(5){animation-delay:.37s}
    .nom .l:nth-child(6){animation-delay:.45s}
    .nom .l:nth-child(7){animation-delay:.53s}
    .age{opacity:0;animation:leve .9s .68s cubic-bezier(.2,.75,.25,1) forwards}
    @keyframes leve{to{opacity:1;transform:none}}
  }
</style>
</head>

<script>
  var NAISSANCE = new Date("2003-08-04T12:00:00+02:00").getTime();
  var CIBLE     = new Date("2026-08-04T00:00:00+02:00").getTime();

  // mode apercu : ?demo affiche l'arrivee, ?demo=90 se place 90 minutes avant midi
  var demo = new URLSearchParams(location.search).get("demo");
  if (demo !== null){
    var avance = parseFloat(demo) || 0;
    var vrai = Date.now;
    Date.now = function(){ return CIBLE - avance * 60000 + (avance ? 0 : 1000); };
  }
  var FENETRE   = 24 * 3600 * 1000;

  var elH=document.getElementById("h"),
      elM=document.getElementById("m"),elS=document.getElementById("s"),
      elVie=document.getElementById("vie"),elJours=document.getElementById("jours"),
      astre=document.getElementById("astre"),parcouru=document.getElementById("parcouru"),
      ticks=document.querySelectorAll(".tick"),
      rose=document.getElementById("rose");

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function espaces(n){ return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u202F"); }

  function eclore(p){
    var k = 0.80 + 0.20 * (1 - Math.pow(1 - p, 2));
    rose.style.transform = "scale(" + k.toFixed(3) + ")";
  }

  function soleil(p){
    var theta = Math.PI - p * (Math.PI / 2);
    var x = 200 + 180 * Math.cos(theta), y = 64 - 58 * Math.sin(theta);
    astre.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") scale(" + (0.92 + 0.22 * p).toFixed(3) + ")");
    for (var i = 0; i < ticks.length; i++){
      var t = parseFloat(ticks[i].getAttribute("data-t"));
      if (t <= p * 0.5) ticks[i].classList.add("passe"); else ticks[i].classList.remove("passe");
    }
    // la moitie gauche de l'arc correspond au trajet jusqu'au zenith
    parcouru.style.strokeDashoffset = (1000 - 500 * p).toFixed(1);
  }

  function tic(){
    var maintenant = Date.now();
    var reste = CIBLE - maintenant;

    elVie.textContent = espaces((maintenant - NAISSANCE) / 1000);
    elJours.textContent = espaces((maintenant - NAISSANCE) / 86400000);

    if (reste <= 0){
      if (!document.body.classList.contains("arrivee")){
        document.body.classList.add("arrivee");
        lancerVoeux();
      }
      soleil(1); eclore(1);
      return;
    }

    var total = Math.floor(reste / 1000);
    elH.textContent = pad(Math.floor(total / 3600));
    elM.textContent = pad(Math.floor(total % 3600 / 60));
    elS.textContent = pad(total % 60);

    var p = 1 - Math.min(Math.max(reste / FENETRE, 0), 1);
    soleil(p); eclore(p);
  }

  var voeux = document.querySelectorAll(".voeu, .filet"), voeuxLances = false;
  function lancerVoeux(){
    if (voeuxLances) return;
    voeuxLances = true;
    for (var i = 0; i < voeux.length; i++){
      (function(el, n){ setTimeout(function(){ el.classList.add("actif"); }, 250 + n * 420); })(voeux[i], i);
    }
  }

  tic();
  setInterval(tic, 200);
</script>
